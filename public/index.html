<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JD TV Playout</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#0b1020;color:#eef2ff}main{max-width:1200px;margin:auto;padding:28px 18px}h1{margin:0}.muted{color:#9aa4bf}.status{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#1a2344;margin:16px 0}.dot{width:10px;height:10px;border-radius:50%;background:#ef4444}.ok .dot{background:#22c55e}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.card{background:#111831;border:1px solid #273152;border-radius:16px;padding:18px}button,input,select{border:1px solid #344064;border-radius:10px;padding:10px;background:#0b1020;color:white}button{cursor:pointer;font-weight:700;background:#4f46e5;border:0}.media{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #222d4f}.row{display:grid;grid-template-columns:100px 1fr auto;gap:10px;margin:10px 0}.row input,.row select{width:100%;box-sizing:border-box}.danger{background:#7f1d1d}.onair{padding:12px;border-radius:12px;background:#090d1b;margin-bottom:14px}code{word-break:break-all}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>JD TV Playout</h1><div class="muted">Programmation locale 24/7 — CasparCG</div><div id="status" class="status"><span class="dot"></span>Vérification…</div>
<div class="onair"><strong>À L’ANTENNE / moteur automatique</strong><div class="muted">La grille est exécutée par l’agent local même si cette page est fermée.</div></div>
<div class="grid"><section class="card"><h2>Bibliothèque médias</h2><div id="dir" class="muted"></div><div id="media"></div></section>
<section class="card"><h2>Grille du jour</h2><div class="muted">Ajoute une heure et un média. À l’heure exacte, l’agent lance le programme.</div><div id="schedule"></div><button onclick="addRow()">+ Ajouter un programme</button> <button onclick="save()">Enregistrer la grille</button><p id="msg" class="muted"></p></section></div></main>
<script>
let media=[], schedule=[];
async function api(url,opt){const r=await fetch(url,opt);return r.json()}
async function check(){const e=document.getElementById('status');try{const d=await api('/api/status');e.className='status '+(d.ok?'ok':'');e.innerHTML='<span class="dot"></span>'+(d.ok?'CasparCG connecté':'CasparCG hors ligne')}catch{e.innerHTML='<span class="dot"></span>Agent indisponible'}}
async function load(){const m=await api('/api/media');media=m.media||[];document.getElementById('dir').innerHTML='Dossier surveillé : <code>'+m.mediaDir+'</code>';document.getElementById('media').innerHTML=media.length?media.map(x=>'<div class="media"><span>'+x.file+'</span><button onclick="play(\''+x.name.replace(/'/g,"\\'")+'\')">▶</button></div>').join(''):'<p>Aucun média détecté dans ce dossier.</p>';const s=await api('/api/schedule');schedule=s.schedule||[];render()}
function render(){document.getElementById('schedule').innerHTML=schedule.map((r,i)=>'<div class="row"><input type="time" value="'+(r.time||'')+'" onchange="schedule['+i+'].time=this.value"><select onchange="schedule['+i+'].media=this.value"><option value="">Choisir…</option>'+media.map(m=>'<option '+(m.name===r.media?'selected':'')+' value="'+m.name+'">'+m.file+'</option>').join('')+'</select><button class="danger" onclick="schedule.splice('+i+',1);render()">×</button></div>').join('')}
function addRow(){schedule.push({time:'',media:''});render()}
async function save(){schedule.sort((a,b)=>a.time.localeCompare(b.time));const d=await api('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schedule})});document.getElementById('msg').textContent=d.ok?'Grille enregistrée ✓':d.error;render()}
async function play(name){await api('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'PLAY 1-1 "'+name+'"'})})}
check();load();setInterval(check,5000);
</script></body></html>
